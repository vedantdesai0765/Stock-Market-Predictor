name: Deploy back end

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'models/**'
      - 'src/**'
      - 'data/**'
      - 'reports/**'
      - 'sentiment_study/**'
      - 'live/**'
      - 'render.yaml'
      - 'Dockerfile'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Render configuration
        run: |
          if [ ! -f "render.yaml" ]; then
            echo "::error::render.yaml not found in repository root."
            exit 1
          fi
          echo "render.yaml blueprint configuration verified."

      - name: Trigger Render Deploy Hook (if configured)
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Triggering deployment via Render Deploy Hook..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${RENDER_DEPLOY_HOOK}")
          http_code=$(echo "$response" | grep "HTTP_STATUS" | cut -d: -f2)
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Successfully triggered Render deployment (HTTP $http_code)."
          else
            echo "::warning::Render deploy hook returned HTTP $http_code: $response"
          fi

      - name: Deployment status notice
        if: env.RENDER_DEPLOY_HOOK == ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "RENDER_DEPLOY_HOOK secret is not set."
          echo "Render's native GitHub integration will automatically build and deploy new commits pushed to main."
          echo "To enable manual or Action-triggered deploys, add RENDER_DEPLOY_HOOK to GitHub repository secrets."
